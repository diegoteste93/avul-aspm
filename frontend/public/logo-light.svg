<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none">
  <defs>
    <!-- V shape (teal accent) -->
    <path id="av-v-l" d="M42.40 -1.50 L113.72 145.00 L185.04 -1.50 L156.13 -1.50 L113.72 85.60 L71.32 -1.50 Z" />
    <!-- A shape (dark petrol) -->
    <path id="av-a-l" d="M0 145 L71.32 -1.5 L142.64 145 L113.73 145 L71.32 57.9 L28.92 145 Z" />
    <g id="avul-mark-light">
      <use href="#av-v-l" fill="#1F6F7A" />
      <use href="#av-a-l" fill="#12313F" />
    </g>
  </defs>

  <!-- Geometric Symbol -->
  <g transform="translate(6, 6) scale(0.24)">
    <use href="#avul-mark-light" />
  </g>

  <!-- Wordmark AVUL -->
  <text x="60" y="32" fill="#12313F" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="1">AVUL</text>

  <!-- ASPM Badge -->
  <rect x="138" y="14" width="62" height="20" rx="3" fill="#E4F0F2" stroke="#1F6F7A" stroke-width="1"/>
  <text x="147" y="28" fill="#1F6F7A" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5">ASPM</text>
</svg>
