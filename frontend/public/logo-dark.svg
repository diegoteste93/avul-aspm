<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none">
  <defs>
    <!-- V shape (cyan accent) -->
    <path id="av-v" d="M42.40 -1.50 L113.72 145.00 L185.04 -1.50 L156.13 -1.50 L113.72 85.60 L71.32 -1.50 Z" />
    <!-- A shape (white) -->
    <path id="av-a" d="M0 145 L71.32 -1.5 L142.64 145 L113.73 145 L71.32 57.9 L28.92 145 Z" />
    <g id="avul-mark-dark">
      <use href="#av-v" fill="#6CC3CF" />
      <use href="#av-a" fill="#FFFFFF" />
    </g>
  </defs>

  <!-- Geometric Symbol -->
  <g transform="translate(6, 6) scale(0.24)">
    <use href="#avul-mark-dark" />
  </g>

  <!-- Wordmark AVUL -->
  <text x="60" y="32" fill="#FFFFFF" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="1">AVUL</text>

  <!-- ASPM Badge -->
  <rect x="138" y="14" width="62" height="20" rx="3" fill="#1F6F7A" fill-opacity="0.35" stroke="#6CC3CF" stroke-width="1" stroke-opacity="0.6"/>
  <text x="147" y="28" fill="#6CC3CF" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" letter-spacing="1.5">ASPM</text>
</svg>
